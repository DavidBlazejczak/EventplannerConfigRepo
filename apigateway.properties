server.port=8084
management.endpoints.web.exposure.include=*

# Corrected URIs to use lowercase service names
spring.cloud.gateway.routes[0].id=event-service
spring.cloud.gateway.routes[0].uri=lb://eventservice
spring.cloud.gateway.routes[0].predicates[0]=Path=/events/**

spring.cloud.gateway.routes[1].id=registration-service
spring.cloud.gateway.routes[1].uri=lb://registrationservice
spring.cloud.gateway.routes[1].predicates[0]=Path=/registrations/**

spring.cloud.gateway.routes[2].id=feedback-service
spring.cloud.gateway.routes[2].uri=lb://feedbackservice
spring.cloud.gateway.routes[2].predicates[0]=Path=/feedback/**

# REMOVE: eureka.instance.ip-address=127.0.0.1
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
