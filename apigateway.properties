server:
  port: 8084

spring:
  application:
    name: ApiGateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            # Event Service
            - id: event-service
              uri: lb://EVENT-SERVICE
              predicates:
                - Path=/events/**

            # Registration Service
            - id: registration-service
              uri: lb://REGISTRATION-SERVICE
              predicates:
                - Path=/registrations/**

            # Review Service
            - id: review-service
              uri: lb://REVIEW-SERVICE
              predicates:
                - Path=/reviews/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8085/eureka
    register-with-eureka: true
    fetch-registry: true
