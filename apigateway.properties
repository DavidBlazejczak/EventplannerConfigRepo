server.port=8084

management.endpoints.web.exposure.include=*

spring.cloud.gateway.routes[0].id=event-service
spring.cloud.gateway.routes[0].uri=lb://EventService
spring.cloud.gateway.routes[0].predicates[0]=Path=/events/**

spring.cloud.gateway.routes[1].id=registration-service
spring.cloud.gateway.routes[1].uri=lb://RegistrationService
spring.cloud.gateway.routes[1].predicates[0]=Path=/registrations/**

spring.cloud.gateway.routes[2].id=review-service
spring.cloud.gateway.routes[2].uri=lb://ReviewService
spring.cloud.gateway.routes[2].predicates[0]=Path=/reviews/**



eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
