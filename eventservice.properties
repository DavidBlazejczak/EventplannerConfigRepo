server.port=8085

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.stream.kafka.binder.brokers=localhost:9092

# Output binding for EventCreatedEvent
spring.cloud.stream.bindings.eventCreatedProducer-out-0.destination=event-created-events
spring.cloud.stream.bindings.eventCreatedProducer-out-0.content-type=application/json

# Output binding for EventUpdatedEvent
spring.cloud.stream.bindings.eventUpdatedProducer-out-0.destination=event-updated-events
spring.cloud.stream.bindings.eventUpdatedProducer-out-0.content-type=application/json



#db
spring.datasource.url=jdbc:h2:file:./data/eventdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
