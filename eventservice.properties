server.port=8085

# Eureka Instance Config (Optional in remote, but fine)
eureka.instance.prefer-ip-address=true
# removed: eureka.instance.ip-address=127.0.0.1


# RabbitMQ           changeed from localhost to rabbitmq
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

rabbitmq.queue.name=javaguides
rabbitmq.exchange.name=javaguides_exchange
rabbitmq.routing.key=javaguides_routing_key

# DB
spring.datasource.url=jdbc:h2:file:./data/eventdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Logging
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.be.pxl.services.eventservice=DEBUG
